services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: campus_companion
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_companion"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - campus-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - campus-redis:/data

volumes:
  campus-postgres:
  campus-redis:

