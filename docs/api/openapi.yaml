              type: object
              additionalProperties: false
              required: [granted, policyVersion]
              properties:
                granted: { type: boolean, const: true }
                policyVersion:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: 必须与 FormationRound.contactPolicyVersion 完全一致，由服务端比较。
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: { type: string, const: DECLINE }
