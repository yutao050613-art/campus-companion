name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: campus_companion
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus_companion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://campus:ci-only-password@127.0.0.1:5432/campus_companion
      NATIVE_POSTGRES_TESTS: "true"
      NATIVE_REDIS_TESTS: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      REDOCLY_TELEMETRY: "off"
      REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.7.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Record immutable run metadata
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          mkdir -p .m2-evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            node --version
            pnpm --version
            docker exec "${POSTGRES_CONTAINER_ID}" postgres --version
            docker exec "${REDIS_CONTAINER_ID}" redis-server --version
          } | tee .m2-evidence/00-environment.log
      - name: Install exact dependencies
        id: install
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .m2-evidence/01-install.log
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml 2>&1 | tee .m2-evidence/02-lockfile-integrity.log
      - name: Apply migration chain to empty PostgreSQL
        id: migrate_first
        run: |
          set -euo pipefail
          pnpm db:migrate 2>&1 | tee .m2-evidence/03-migrate-first.log
      - name: Prove migration deployment is idempotent
        id: migrate_second
        run: |
          set -euo pipefail
          pnpm db:migrate 2>&1 | tee .m2-evidence/04-migrate-second.log
      - name: Verify migration history is clean
        id: migrate_status
        run: |
          set -euo pipefail
          pnpm db:status 2>&1 | tee .m2-evidence/05-migrate-status.log
      - name: Static and automated checks
        id: full_check
        run: |
          set -euo pipefail
          pnpm check 2>&1 | tee .m2-evidence/06-full-check.log
      - name: Prove native PostgreSQL tests were not skipped
        id: native_postgres
        run: |
          set -euo pipefail
          pnpm --filter @campus/database exec vitest run test/native-postgres.e2e.test.ts --reporter=json --outputFile=../../.m2-evidence/07-native-postgres.json
          node tools/assert-native-vitest-report.mjs .m2-evidence/07-native-postgres.json PostgreSQL 4 | tee .m2-evidence/08-native-postgres-assertion.log
      - name: Prove M2 native API tests were not skipped
        id: native_m2_api
        run: |
          set -euo pipefail
          pnpm --filter @campus/api exec vitest run test/native-m2.e2e.test.ts --reporter=json --outputFile=../../.m2-evidence/09-native-m2-api.json
          node tools/assert-native-vitest-report.mjs .m2-evidence/09-native-m2-api.json M2-API 3 | tee .m2-evidence/10-native-m2-api-assertion.log
      - name: Prove native Redis tests were not skipped
        id: native_redis
        run: |
          set -euo pipefail
          pnpm --filter @campus/worker exec vitest run test/native-redis.e2e.test.ts --reporter=json --outputFile=../../.m2-evidence/11-native-redis.json
          node tools/assert-native-vitest-report.mjs .m2-evidence/11-native-redis.json Redis 1 | tee .m2-evidence/12-native-redis-assertion.log
      - name: Full dependency audit
        id: dependency_audit
        run: |
          set -euo pipefail
          pnpm audit --audit-level high --json 2>&1 | tee .m2-evidence/13-dependency-audit.json
      - name: Generate raw evidence manifest
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          MIGRATE_FIRST_OUTCOME: ${{ steps.migrate_first.outcome }}
          MIGRATE_SECOND_OUTCOME: ${{ steps.migrate_second.outcome }}
          MIGRATE_STATUS_OUTCOME: ${{ steps.migrate_status.outcome }}
          FULL_CHECK_OUTCOME: ${{ steps.full_check.outcome }}
          NATIVE_POSTGRES_OUTCOME: ${{ steps.native_postgres.outcome }}
          NATIVE_M2_API_OUTCOME: ${{ steps.native_m2_api.outcome }}
          NATIVE_REDIS_OUTCOME: ${{ steps.native_redis.outcome }}
          DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .m2-evidence
          {
            echo "install=${INSTALL_OUTCOME}"
            echo "migrate_first=${MIGRATE_FIRST_OUTCOME}"
            echo "migrate_second=${MIGRATE_SECOND_OUTCOME}"
            echo "migrate_status=${MIGRATE_STATUS_OUTCOME}"
            echo "full_check=${FULL_CHECK_OUTCOME}"
            echo "native_postgres=${NATIVE_POSTGRES_OUTCOME}"
            echo "native_m2_api=${NATIVE_M2_API_OUTCOME}"
            echo "native_redis=${NATIVE_REDIS_OUTCOME}"
            echo "dependency_audit=${DEPENDENCY_AUDIT_OUTCOME}"
          } > .m2-evidence/14-step-outcomes.txt
          find .m2-evidence -maxdepth 1 -type f ! -name 'sha256sums.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > .m2-evidence/sha256sums.txt
      - name: Upload M2 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m2-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .m2-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
